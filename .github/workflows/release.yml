name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.version.outputs.eligible }}
      sha: ${{ steps.version.outputs.sha }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Calculate the release version
        id: version
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const sha = context.sha;
            const pulls = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {...context.repo, commit_sha: sha, per_page: 100}
            );
            const pull = pulls.find(candidate =>
              candidate.merged_at && candidate.base.ref === 'master' && candidate.merge_commit_sha === sha
            );
            if (!pull) {
              core.info(`No merged master pull request is associated with ${sha}; no release required.`);
              core.setOutput('eligible', 'false');
              return;
            }

            const title = pull.title.trim();
            const body = pull.body || '';
            const breaking = /^[a-z]+(?:\([^)]*\))?!:/i.test(title) || /(^|\n)BREAKING[ -]CHANGE:/i.test(body);
            const feature = /^feat(?:\([^)]*\))?:/i.test(title);
            const fix = /^fix(?:\([^)]*\))?:/i.test(title);
            if (!breaking && !feature && !fix) {
              core.info(`PR #${pull.number} is not a fix, feature, or breaking change; no release required.`);
              core.setOutput('eligible', 'false');
              return;
            }

            const versionFile = await github.rest.repos.getContent({...context.repo, path: 'version.txt', ref: sha});
            if (Array.isArray(versionFile.data) || versionFile.data.type !== 'file') {
              throw new Error('version.txt must contain a stable SemVer version.');
            }
            const baseline = Buffer.from(versionFile.data.content, 'base64').toString('utf8').trim();
            const pattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
            if (!pattern.test(baseline)) throw new Error(`Invalid version.txt value: ${baseline}`);

            const tags = await github.paginate(github.rest.repos.listTags, {...context.repo, per_page: 100});
            const versions = [baseline, ...tags.map(tag => tag.name).filter(name => pattern.test(name))];
            const compare = (left, right) => {
              const a = left.split('.').map(Number);
              const b = right.split('.').map(Number);
              return a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
            };
            const current = versions.sort(compare).at(-1);
            let [major, minor, patch] = current.split('.').map(Number);
            if (breaking) [major, minor, patch] = [major + 1, 0, 0];
            else if (feature) [minor, patch] = [minor + 1, 0];
            else patch += 1;
            const tag = `${major}.${minor}.${patch}`;

            try {
              const existing = await github.rest.repos.getReleaseByTag({...context.repo, tag});
              if (existing.data.target_commitish !== sha) throw new Error(`${tag} already targets another commit.`);
              core.info(`${tag} is already published for ${sha}.`);
              core.setOutput('eligible', 'false');
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            try {
              await github.rest.git.getRef({...context.repo, ref: `tags/${tag}`});
              throw new Error(`${tag} already exists without a matching GitHub Release.`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            core.setOutput('eligible', 'true');
            core.setOutput('sha', sha);
            core.setOutput('tag', tag);
            core.info(`PR #${pull.number} will release ${tag} from ${sha}.`);

  tests:
    needs: prepare
    if: ${{ needs.prepare.outputs.eligible == 'true' }}
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  publish:
    needs: [prepare, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the tested release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        with:
          script: |
            const sha = process.env.RELEASE_SHA;
            const tag = process.env.RELEASE_TAG;
            if (!/^[0-9a-f]{40}$/.test(sha) || !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag)) {
              throw new Error('Expected an immutable commit SHA and stable SemVer tag.');
            }
            try {
              const existing = await github.rest.repos.getReleaseByTag({...context.repo, tag});
              if (existing.data.target_commitish !== sha) throw new Error(`${tag} already targets another commit.`);
              core.info(`${tag} is already published for ${sha}.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              await github.rest.git.getRef({...context.repo, ref: `tags/${tag}`});
              throw new Error(`${tag} already exists without a matching GitHub Release.`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              target_commitish: sha,
              name: tag,
              generate_release_notes: true,
              draft: false,
              prerelease: false,
            });
            core.info(`Published ${tag} from tested commit ${sha}.`);
